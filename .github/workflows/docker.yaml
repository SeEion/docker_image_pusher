name: Sync Dual-Arch (AMD64 & ARM64) to Aliyun

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  sync:
    name: Sync Dual-Arch
    runs-on: ubuntu-latest
    # 直接在官方最新的 skopeo 容器环境中运行，保证支持 --strip-removed-platforms 参数
    container:
      image: quay.io/skopeo/stable:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Filtered Images to Aliyun
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            # 过滤空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            
            # 清理行内多余空格及 sha 杂质
            src_image=$(echo "$line" | sed 's/--platform=[^ ]* *//g' | xargs)
            src_image="${src_image%%@*}"

            # 提取 镜像名:版本号 (例如 calico/node:v3.24.5 -> node:v3.24.5)
            image_name_tag=$(echo "$src_image" | awk -F'/' '{print $NF}')
            
            # 目标阿里云镜像地址
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$image_name_tag"

            echo "=========================================================="
            echo "开始同步 (仅保留 amd64 + arm64): $src_image -> $new_image"
            echo "=========================================================="

            # 执行过滤并写入精简后的双架构 Manifest
            skopeo copy \
              --multi-arch=linux/amd64,linux/arm64 \
              --strip-removed-platforms \
              --remove-signatures \
              --dest-creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" \
              "docker://$src_image" \
              "docker://$new_image"

          done < images.txt
